services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_PATH: /app/data/jobs.db
      FRONTEND_ORIGINS: http://localhost:5173,http://localhost
      JOB_SIMULATION_STEP_SECONDS: 0.35
      MIN_DURATION_SECONDS: 5
      MAX_DURATION_SECONDS: 300
      MAX_PROMPT_LENGTH: 1000
      DEFAULT_DURATION_SECONDS: 45
      AUDIO_PROVIDER: procedural
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_BUCKET: incubrix-outputs
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-incubrix-local}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-incubrix-local-development-only}
      NARRATION_ALLOWED_PRIVATE_HOSTS: ${NARRATION_ALLOWED_PRIVATE_HOSTS:-}
      NARRATION_ALLOW_HTTP: ${NARRATION_ALLOW_HTTP:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      HF_BASE_URL: ${HF_BASE_URL:-https://router.huggingface.co/v1}
      HF_API_KEY: ${HF_API_KEY:-}
      HF_MODEL: ${HF_MODEL:-openai/gpt-oss-20b:fastest}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      LLM_AUTO_FALLBACK_TO_MOCK: ${LLM_AUTO_FALLBACK_TO_MOCK:-true}
      AUDIO_OUTPUT_DIR: /app/audio/generated
      AUDIO_SAMPLE_RATE: ${AUDIO_SAMPLE_RATE:-44100}
      AUDIO_SEED: ${AUDIO_SEED:-4281097}
    volumes:
      - jobs-data:/app/data
      - audio-data:/app/audio/generated
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-incubrix-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-incubrix-local-development-only}
    volumes:
      - object-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile.tests
    environment:
      LLM_PROVIDER: mock
      AUDIO_PROVIDER: procedural
      STORAGE_BACKEND: local
      RUN_MINIO_TEST: "1"
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-incubrix-local}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-incubrix-local-development-only}
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./test_results:/app/test_results

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  object-data:
  audio-data:
  jobs-data:
